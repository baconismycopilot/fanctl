[project]
name = "fanctl"
version = "0.1.0"
description = "Unified CLI for NZXT devices, over liquidctl and OpenRGB"
readme = "README.md"
requires-python = ">=3.11"
# GPL because both runtime dependencies are: liquidctl is GPL-3.0-or-later and
# openrgb-python is GPLv3, and both are imported as libraries rather than run
# as subprocesses. A permissive licence here would not be ours to give.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

# liquidctl is deliberately pinned: caps.py and the liquidctl backend depend on
# internal driver attributes (_speed_channels, _color_channels) and on method
# identity against base classes. That API carries no stability guarantee, so an
# unpinned upgrade could break capability detection silently.
dependencies = [
    "liquidctl==1.16.0",
    "openrgb-python>=0.3",
]

[project.scripts]
fanctl = "fancontrol.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=3",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

# Pinned explicitly so a lint run here does not depend on whatever global ruff
# config happens to be installed. Bandit's S rules are left out on purpose:
# several except-and-carry-on blocks here are deliberate and commented, and a
# best-effort cleanup path really does have nothing useful to log.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fancontrol"]
